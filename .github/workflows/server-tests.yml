# The plan server's offline tests, inside the production image (Fantasy Hockey AI/Server/Dockerfile),
# so a dependency missing from requirements.txt fails here rather than on the server. No secrets,
# no platform reads, no deploy: a push never reaches the live server.
name: server-tests

on:
  push:
    paths: ["Fantasy Hockey AI/**", ".github/workflows/server-tests.yml"]
  pull_request:
    paths: ["Fantasy Hockey AI/**", ".github/workflows/server-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: "Fantasy Hockey AI/Server"
          tags: fantasy-hockey-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests and settings check
        run: |
          docker run --rm -v "$PWD:/app" -w "/app/Fantasy Hockey AI/Server" fantasy-hockey-server:ci sh -c '
            pip install -q pytest httpx &&
            python -m pytest tests -q -p no:cacheprovider &&
            python sync_league_settings.py --check'
