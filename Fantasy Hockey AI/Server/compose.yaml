# The test server on this PC, capped like the Azure B2ats v2 VM (2 vCPU, 1 GiB RAM, plus swap).
#   docker compose up -d --build        (from this folder) starts it with the plan server running
#   docker compose exec server bash      a shell in it, the repo at /app
#   docker compose logs -f server        the server's output
services:
  server:
    build: .
    image: fantasy-hockey-server
    cpus: 2
    mem_limit: 1g
    memswap_limit: 3g          # 1 GiB of memory + 2 GiB of swap, as the VM will have
    environment:
      # The container's own database (below), the only one written since the cutover (2026-10-15);
      # host.docker.internal (the PC's SQL Server) is the rollback, with the Windows tasks back on.
      NHLSTATS_DB_SERVER: db,1433
      TZ: America/Vancouver                      # "today" is the PC's local day, as on Windows
    volumes:
      - ../..:/app             # the repo: code, Settings, models and data files
    ports:
      - "127.0.0.1:8000:8000"  # the server's API, from this PC only (Phase 1.5)
    working_dir: "/app/Fantasy Hockey AI/Server"
    # The plan server (the app shows it). --jobs: it runs the daily jobs (scheduled.py)
    # in place of the Windows tasks; the nightly ends by copying the database back into the PC's.
    command: ["python", "server.py", "--host", "0.0.0.0", "--jobs"]
    restart: unless-stopped    # back up when Docker Desktop starts, until `docker compose down`
    depends_on: [db]           # started first: everything reads and writes it

  # The container's own database (plan: container-own-db, the doc's Phase 3 on this PC): SQL Server
  # 2025 Express, a slim copy of the PC's NHLStats (db_seed.py), and since 2026-10-15 the one written:
  # the PC's NHLStats is only brought up to it each night (sync_back.py). Its data lives in the db-data volume (kept across
  # `docker compose down`; `down -v` deletes it). The admin password comes from .env
  # (MSSQL_SA_PASSWORD). dbseed/ (gitignored) is where a backup of the PC's database is put to restore.
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      TZ: America/Vancouver
    env_file:
      - path: .env
        required: true
    mem_limit: 2g
    volumes:
      - db-data:/var/opt/mssql
      - ./dbseed:/seed
    ports:
      - "127.0.0.1:14330:1433"   # from this PC (checks, the copy-back); the server uses db:1433
    restart: unless-stopped

  # The Cloudflare Tunnel (plan: Phone App Remote Access): dials out to Cloudflare, which serves the
  # app at the tunnel's public hostname and passes each call to http://server:8000 on this network.
  # Nothing listens on the PC for it. TUNNEL_TOKEN comes from .env here (gitignored).
  tunnel:
    image: cloudflare/cloudflared:2025.9.1
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - path: .env
        required: false        # without it the tunnel alone fails to start
    depends_on: [server]
    restart: unless-stopped

volumes:
  db-data:
